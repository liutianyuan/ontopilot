actions:
  aRBACEIHyperkalemiaBlock:
    description: 防止高钾患者使用升高血钾的降压药
    params:
      id:
        type: string
        required: true
      note:
        type: string
        required: false
    target_type: Drug
    edits:
    - set:
        orderStatus: blocked
        actionStatus: blocked_by_hyperkalemia_rule
        actionReason: '{note}'
        actionChannel: CDS prescription interceptor
        lastAction: aRBACEIHyperkalemiaBlock
    requires_confirmation: true
  cKD4ImagingAssessmentReminder:
    description: 确保 CKD 4 期患者及时完成透析前评估
    params:
      id:
        type: string
        required: true
      note:
        type: string
        required: false
    target_type: DiseaseStage
    edits:
    - set:
        assessmentStatus: overdue_requires_imaging
        reminderStatus: pending_physician_ack
        actionReason: '{note}'
        actionChannel: EMR admission checklist
        lastAction: cKD4ImagingAssessmentReminder
    requires_confirmation: true
  metforminPrescriptionBlock:
    description: 防止肾功能不全患者使用禁忌药物
    params:
      id:
        type: string
        required: true
      note:
        type: string
        required: false
    target_type: Drug
    edits:
    - set:
        orderStatus: blocked
        actionStatus: blocked_by_egfr_rule
        actionReason: '{note}'
        actionChannel: CDS prescription interceptor
        lastAction: metforminPrescriptionBlock
    requires_confirmation: true
  researchCohortDataExtraction:
    description: 支持临床科研的一键式数据提取
    params:
      id:
        type: string
        required: true
      note:
        type: string
        required: false
    target_type: CohortCriteria
    edits:
    - set:
        extractionStatus: pending_export
        actionReason: '{note}'
        targetSystem: research data mart
        lastAction: researchCohortDataExtraction
    requires_confirmation: true
  dialysisMonthlyReviewQCReport:
    description: 监控透析患者的定期随访依从性
    params:
      id:
        type: string
        required: true
      note:
        type: string
        required: false
    target_type: QualityMetric
    edits:
    - set:
        qcReportStatus: pending_submit
        actionReason: '{note}'
        targetSystem: quality control system
        lastAction: dialysisMonthlyReviewQCReport
    requires_confirmation: true
  hyperkalemiaCriticalAlert:
    description: 实时监测血钾，触发分级预警以确保护理和医师及时知晓
    params:
      id:
        type: string
        required: true
      note:
        type: string
        required: false
    target_type: Indicator
    edits:
    - set:
        alertLevel: critical
        actionStatus: alert_pending_ack
        notificationStatus: pending_physician_and_nurse_ack
        actionReason: '{note}'
        actionChannel: LIS critical value alert
        lastAction: hyperkalemiaCriticalAlert
    requires_confirmation: true
functions:
  aKIStage1DiagnosisRule:
    description: 依据 KDIGO 标准，检测肌酐急性升高以诊断 AKI
    params:
      objectType:
        type: string
        required: false
      objectId:
        type: string
        required: false
    returns: rule_evaluation_result
    permission: aKIStage1DiagnosisRule
  aRBACEISafetyRule:
    description: 高钾或肾动脉狭窄时，拦截 RASi 类药物
